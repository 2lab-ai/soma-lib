name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: ./scripts/check-module-inventory.sh
      - run: npm run typecheck
      - run: npm test
      - name: Build and verify committed dist/ is in sync with src/
        run: |
          npm run build
          git diff --exit-code -- dist || {
            echo "::error::dist/ is stale — run 'npm run build' and commit the result."
            exit 1
          }
      - uses: oven-sh/setup-bun@v2
      - name: Package-boundary smoke (packed tarball via node CJS + tsc + bun)
        run: ./scripts/smoke-pack.sh
